<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Special Day</title>

<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Georgia, serif;
    overflow: hidden;
}

/* ================= OPENING SCREEN ================= */

#startOverlay {
    position: fixed;
    inset: 0;
    z-index: 10000;

    background:
        linear-gradient(
            rgba(0,0,0,0.45),
            rgba(0,0,0,0.75)
        );

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    color: white;
    cursor: pointer;
    text-align: center;

    padding: 30px;

    backdrop-filter: blur(3px);

    animation: overlayFade 1.5s ease;
}

#startOverlay .open-title {
    font-family: "Allura", cursive;
    font-size: 58px;
    margin-bottom: 12px;

    text-shadow: 0 3px 15px rgba(0,0,0,0.8);

    animation: titleFloat 2.5s ease-in-out infinite;
}

#startOverlay .open-subtitle {
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;

    opacity: 0.85;

    margin-bottom: 35px;
}

#startOverlay .open-button {
    padding: 15px 32px;

    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 50px;

    background: rgba(255,255,255,0.12);

    color: white;

    font-family: Georgia, serif;
    font-size: 16px;
    letter-spacing: 2px;

    box-shadow: 0 5px 25px rgba(0,0,0,0.4);

    transition: transform 0.3s ease,
                background 0.3s ease;
}

#startOverlay .open-button:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.22);
}

#startOverlay .open-heart {
    margin-top: 25px;
    font-size: 25px;

    animation: heartBeat 1.5s ease-in-out infinite;
}


/* ================= COUNTDOWN PAGE ================= */

#countdownPage {
    height: 100vh;

    background-image:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.45)
        ),
        url("first.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;
}

#title {
    font-family: "Allura", cursive;
    font-size: 65px;

    margin-bottom: 30px;

    text-shadow: 0 3px 15px rgba(0,0,0,0.8);
}

#timer {
    display: flex;
    gap: 25px;

    font-size: 25px;
}

.time-box {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.number {
    font-size: 45px;
    font-weight: bold;
}

.label {
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 5px;
}


/* ================= FINAL PAGE ================= */

#finalPage {
    display: none;

    position: relative;

    height: 100vh;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.35),
            rgba(255,255,255,0.35)
        ),
        url("final.jpg");

    background-size: cover;
    background-position: center;

    overflow: hidden;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;
}

#message {
    position: relative;
    z-index: 5;

    max-width: 850px;

    padding: 25px;

    font-family: "Allura", cursive;

    font-size: 38px;

    line-height: 1.5;

    color: #800020;

    text-shadow:
        0 1px 2px rgba(255,255,255,0.7);

    text-align: center;
}


/* ================= HEARTS ================= */

#heartContainer {
    position: absolute;
    inset: 0;

    pointer-events: none;

    overflow: hidden;
}

.heart {
    position: absolute;

    bottom: -30px;

    font-size: 22px;

    animation: floatHeart 6s linear forwards;

    opacity: 0.9;
}


/* ================= ANIMATIONS ================= */

@keyframes overlayFade {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes titleFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

    #startOverlay .open-title {
        font-size: 50px;
    }

    #startOverlay .open-subtitle {
        font-size: 12px;
        letter-spacing: 3px;
    }

    #startOverlay .open-button {
        padding: 14px 28px;
        font-size: 14px;
    }

    #title {
        font-size: 34px;
    }

    #timer {
        gap: 12px;
        font-size: 20px;
    }

    .number {
        font-size: 32px;
    }

    .label {
        font-size: 11px;
    }

    #message {
        font-size: 23px;
        max-width: 92%;
        line-height: 1.4;
    }
}

</style>
</head>


<body>


<!-- ================= OPENING SCREEN ================= -->

<div id="startOverlay">

    <div class="open-title">
        Our Story
    </div>

    <div class="open-subtitle">
        A little memory made just for you
    </div>

    <div class="open-button">
        Tap to open
    </div>

    <div class="open-heart">
        ❤️
    </div>

</div>


<!-- ================= MUSIC ================= -->

<audio id="backgroundMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
</audio>


<!-- ================= COUNTDOWN ================= -->

<div id="countdownPage">

    <div id="title">
        Our Special Day
    </div>

    <div id="timer">

        <div class="time-box">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="time-box">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>

        <div class="time-box">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="time-box">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>

    </div>

</div>


<!-- ================= FINAL PAGE ================= -->

<div id="finalPage">

    <div id="heartContainer"></div>

    <div id="message"></div>

</div>


<script>


/* ================= MUSIC ================= */

const music = document.getElementById("backgroundMusic");
const overlay = document.getElementById("startOverlay");

overlay.addEventListener("click", function() {

    music.volume = 0.7;

    music.play().then(() => {

        overlay.style.display = "none";

    });

});


/* ================= COUNTDOWN ================= */

/* TEST DATE */

const targetDate =
    new Date("October 2, 2026 00:00:00").getTime();


const countdownPage =
    document.getElementById("countdownPage");

const finalPage =
    document.getElementById("finalPage");


const daysElement =
    document.getElementById("days");

const hoursElement =
    document.getElementById("hours");

const minutesElement =
    document.getElementById("minutes");

const secondsElement =
    document.getElementById("seconds");


function updateCountdown() {

    const now = new Date().getTime();

    const difference = targetDate - now;


    if (difference <= 0) {

        countdownPage.style.display = "none";

        finalPage.style.display = "flex";

        showMessage();

        clearInterval(timerInterval);

        return;
    }


    const days =
        Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

    const hours =
        Math.floor(
            (difference / (1000 * 60 * 60)) % 24
        );

    const minutes =
        Math.floor(
            (difference / (1000 * 60)) % 60
        );

    const seconds =
        Math.floor(
            (difference / 1000) % 60
        );


    daysElement.textContent =
        String(days).padStart(2, "0");

    hoursElement.textContent =
        String(hours).padStart(2, "0");

    minutesElement.textContent =
        String(minutes).padStart(2, "0");

    secondsElement.textContent =
        String(seconds).padStart(2, "0");
}


const timerInterval =
    setInterval(updateCountdown, 1000);

updateCountdown();


/* ================= FINAL MESSAGE ================= */

function showMessage() {

    const faceLaugh =
        String.fromCodePoint(0x1F602);

    const heart =
        String.fromCodePoint(0x2764, 0xFE0F);

    const crown =
        String.fromCodePoint(0x1F451);


    const sentences = [

        "Can you believe it? It's been 1 year of you putting up with me and me putting up with you "
        + faceLaugh + heart,

        "Nov 2nd - Our first anniversary together, Yassine.",

        "Honestly, it's been the best year of my life. You are my favorite silly person, my safe place, and my biggest headache in the best way.",

        "One year down, forever to go?",

        "I love you so much. Happy 1st anniversary, my king "
        + crown

    ];


    let sentenceIndex = 0;
    let letterIndex = 0;


    function typeSentence() {

        if (sentenceIndex >= sentences.length) {

            createHearts();

            return;
        }


        const sentence =
            sentences[sentenceIndex];


        if (letterIndex < sentence.length) {

            message.innerHTML +=
                sentence.charAt(letterIndex);

            letterIndex++;

            setTimeout(typeSentence, 45);

        } else {

            message.innerHTML += "<br><br>";

            sentenceIndex++;

            letterIndex = 0;

            setTimeout(typeSentence, 600);
        }
    }


    typeSentence();
}


/* ================= FLOATING HEARTS ================= */

function createHearts() {

    const container =
        document.getElementById("heartContainer");


    setInterval(() => {

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent =
            String.fromCodePoint(0x2764, 0xFE0F);


        heart.style.left =
            Math.random() * 100 + "%";


        heart.style.fontSize =
            (15 + Math.random() * 20) + "px";


        heart.style.animationDuration =
            (4 + Math.random() * 4) + "s";


        container.appendChild(heart);


        setTimeout(() => {

            heart.remove();

        }, 8000);

    }, 500);
}

</script>

</body>
</html>
